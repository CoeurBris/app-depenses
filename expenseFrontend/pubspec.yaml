name: expenses
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  # charts_flutter: ^0.12.0
  # dio: ^5.9.2
  fl_chart: ^1.2.0
 # http: ^1.2.2  
